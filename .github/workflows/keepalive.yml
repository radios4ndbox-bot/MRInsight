# Evita la pausa del progetto Supabase sul piano Free (dopo 1 settimana di inattività):
# ogni 3 giorni chiama la funzione pubblica ping(), che non legge alcun dato.
# Usa solo URL e chiave publishable, già pubblici in assets/js/config.js.
#
# Nota: GitHub disattiva i workflow programmati dopo 60 giorni senza attività
# sul repository. Se succede, riattivalo da Actions → Keep-alive Supabase.

name: Keep-alive Supabase

on:
  schedule:
    - cron: '23 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(sed -n "s/^export const SUPABASE_URL = '\(.*\)';/\1/p" assets/js/config.js)
          KEY=$(sed -n "s/^export const SUPABASE_PUBLISHABLE_KEY = '\(.*\)';/\1/p" assets/js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js non ancora configurato: niente da fare."
            exit 0
          fi
          case "$KEY" in sb_publishable_*) ;; *) echo "Chiave non publishable: interrotto."; exit 1 ;; esac
          curl -fsS --retry 3 --retry-delay 20 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Ping riuscito."
